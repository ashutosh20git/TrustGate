name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the multi-replica audit chain test (tests/test_audit_chain_concurrency.py).
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OPA
        run: |
          curl -L -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          mkdir -p .tools && cp /usr/local/bin/opa .tools/opa

      - name: Check Rego policies
        run: opa check packs/

      - name: Rego unit tests (floor and pack rules)
        run: opa test packs/ -v

      - name: Install
        run: |
          python -m pip install -U pip
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install -e ".[ingest,attachments,images,output-scan,recheck-xgb,mcp,server,eval,dev]"
          python -m spacy download en_core_web_lg

      - name: Model pin check (no unpinned LiteLLM model)
        run: python scripts/check_model_pins.py

      - name: Tests
        env:
          TRUSTGATE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
        run: pytest -q

      - name: Eval smoke (offline simulator) + regression guard
        run: python scripts/ci_eval_guard.py

      - name: Re-check guard (false-benign rate on attacker-affordable facts)
        run: python -m eval.recheck_bench --check

      - name: AgentDojo guard (banking suite, hijacked agent; full run in docs/BENCHMARKS.md)
        run: |
          pip install ".[bench]"
          python -m eval.agentdojo_bench --suites banking --check --out /tmp/agentdojo.json

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid (with the checkout's build override, and standalone)
        run: |
          touch .env
          POSTGRES_PASSWORD=ci docker compose config -q
          mkdir standalone && cp docker-compose.yml standalone/ && touch standalone/.env
          cd standalone && POSTGRES_PASSWORD=ci docker compose config -q
          ! POSTGRES_PASSWORD=ci docker compose config | grep -q dockerfile

      - name: Setup script runs without the repo
        run: |
          mkdir -p /tmp/noclone && cd /tmp/noclone
          python3 -I - --analyst ci < "$GITHUB_WORKSPACE/scripts/init_secrets.py"
          test -s .env && test -s secrets/ingest_token.txt && test -s secrets/analyst_tokens.txt
          grep -q '^POSTGRES_PASSWORD=..' .env

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/trustgate -f deploy/helm/trustgate/ci/test-values.yaml
          helm template ci deploy/helm/trustgate -f deploy/helm/trustgate/ci/test-values.yaml > rendered.yaml

      - name: Rendered manifests match the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
