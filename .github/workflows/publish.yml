name: Publish image

# Builds docker/Dockerfile (the engine) and dashboard/Dockerfile (the analyst
# dashboard) and pushes both to GitHub Container Registry, so self-hosters can
# `docker compose pull` instead of building them themselves.
#   main      -> ghcr.io/<owner>/trustgate[-dashboard]:latest and :sha-<short>
#   tag v2.5.0 -> ghcr.io/<owner>/trustgate[-dashboard]:2.5 and :2.5.0
# GitHub creates new packages as private: set the package to Public once in
# its settings (Packages -> trustgate -> Package settings -> Change visibility).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lower case.
          images: ghcr.io/${{ github.repository_owner }}/trustgate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=TrustGate
            org.opencontainers.image.description=Deterministic action gate for AI SOC agents

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/trustgate:sha-$(git rev-parse --short=7 HEAD)"
          docker pull "$image"
          docker run --rm "$image" python -c "import trustgate, services.proxy.main, services.ingest.main; print('imports ok')"
          docker run --rm "$image" test -f models/recheck_xgb.json
          test "$(docker run --rm "$image" id -u)" = 10001

  dashboard-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustgate-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=TrustGate dashboard
            org.opencontainers.image.description=Analyst dashboard for the TrustGate action gate

      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Smoke test the published dashboard image
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/trustgate-dashboard:sha-$(git rev-parse --short=7 HEAD)"
          docker pull "$image"
          test "$(docker run --rm "$image" id -u)" = 10001
          docker run -d --name dash -p 3000:3000 "$image"
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/login >/dev/null
