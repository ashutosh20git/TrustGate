name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly: new CVEs appear without a code change

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install ".[ingest,attachments,output-scan,recheck-xgb,mcp,server,eval,dev]" bandit pip-audit

      - name: Bandit (any high-severity finding fails)
        run: bandit -q -r trustgate services scripts -lll

      - name: pip-audit (any dependency with a known vulnerability fails)
        run: pip-audit --vulnerability-service pypi

      - name: Fuzz the parsers that read attacker bytes (any crash or hang fails)
        run: python -m eval.fuzz_ingest --iterations 300 --check --out /tmp/fuzz.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t trustgate:scan .

      - name: Trivy (report HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: trustgate:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Trivy (any fixable CRITICAL fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: trustgate:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
