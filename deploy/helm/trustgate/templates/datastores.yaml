{{- $fn := include "trustgate.fullname" . -}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  selector: {{- include "trustgate.selector" (list . "postgres") | nindent 4 }}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fn }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "trustgate.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "trustgate.selector" (list . "postgres") | nindent 8 }}
    spec:
      securityContext: {fsGroup: 70, runAsUser: 70, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: POSTGRES_USER, value: trustgate}
            - {name: POSTGRES_DB, value: trustgate}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "trustgate.secretName" . }}-env, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, trustgate]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgresql.storage }}}}
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  selector: {{- include "trustgate.selector" (list . "redis") | nindent 4 }}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "trustgate.selector" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "trustgate.selector" (list . "redis") | nindent 8 }}
    spec:
      securityContext: {runAsUser: 999, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-opa
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  selector: {{- include "trustgate.selector" (list . "opa") | nindent 4 }}
  ports: [{name: http, port: 8181, targetPort: 8181}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-opa
  labels: {{- include "trustgate.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "trustgate.selector" (list . "opa") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "trustgate.selector" (list . "opa") | nindent 8 }}
      annotations:
        checksum/packs: {{ .Values.opa.packsConfigMap | default .Values.image.tag | sha256sum | trunc 16 }}
    spec:
      {{- include "trustgate.podSpec" . | nindent 6 }}
      {{- if not .Values.opa.packsConfigMap }}
      # The policy packs ship in the TrustGate image; copy them so OPA and the proxy
      # always run the same version.
      initContainers:
        - name: packs
          image: {{ include "trustgate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          command: [sh, -c, "cp /app/packs/*.rego /app/packs/*.json /packs/"]
          volumeMounts: [{name: packs, mountPath: /packs}]
      {{- end }}
      containers:
        - name: opa
          image: {{ .Values.opa.image }}
          args: [run, --server, --addr=0.0.0.0:8181, /packs]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports: [{containerPort: 8181}]
          readinessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 5
          volumeMounts: [{name: packs, mountPath: /packs, readOnly: true}]
      volumes:
        {{- if .Values.opa.packsConfigMap }}
        - {name: packs, configMap: {name: {{ .Values.opa.packsConfigMap }}}}
        {{- else }}
        - {name: packs, emptyDir: {}}
        {{- end }}
