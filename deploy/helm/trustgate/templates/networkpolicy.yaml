{{- if .Values.networkPolicy.enabled }}
{{- $fn := include "trustgate.fullname" . -}}
{{- /* backend component -> components allowed to reach it (Compose core-net) */ -}}
{{- $backends := dict
  "postgres" (list "proxy" "ingest" "mock-soc")
  "redis"    (list "proxy")
  "opa"      (list "proxy")
  "detector" (list "ingest")
  "mock-soc" (list "proxy")
-}}
{{- range $backend, $clients := $backends }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-{{ $backend }}
  labels: {{- include "trustgate.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "trustgate.selector" (list $ $backend) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $clients }}
        - podSelector:
            matchLabels: {{- include "trustgate.selector" (list $ .) | nindent 14 }}
        {{- end }}
{{- end }}
{{- /* Front doors: the agent -> proxy, the SIEM -> ingest. Empty list = anyone. */ -}}
{{- range $front := list (list "proxy" $.Values.networkPolicy.proxyFrom) (list "ingest" $.Values.networkPolicy.ingestFrom) }}
{{- if index $front 1 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-{{ index $front 0 }}
  labels: {{- include "trustgate.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "trustgate.selector" (list $ (index $front 0)) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml (index $front 1) | nindent 8 }}
        # the dashboard reads the analyst API through the proxy
        - podSelector:
            matchLabels: {{- include "trustgate.selector" (list $ "dashboard") | nindent 14 }}
{{- end }}
{{- end }}
{{- end }}
