{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trustgate.secretName" . }}
  labels: {{- include "trustgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  ingest_token: {{ required "secrets.ingestToken is required (scripts/init_secrets.py)" .Values.secrets.ingestToken | quote }}
  analyst_tokens: {{ required "secrets.analystTokens is required (scripts/init_secrets.py)" .Values.secrets.analystTokens | quote }}
  {{- if .Values.mockSoc.enabled }}
  mock_soc_token: {{ required "secrets.mockSocToken is required with mockSoc.enabled" .Values.secrets.mockSocToken | quote }}
  {{- end }}
  {{- with .Values.secrets.provenanceKey }}
  provenance_key: {{ . | quote }}
  {{- end }}
{{- end }}
---
# Environment secrets: database URLs and API keys. Always chart-managed, because the
# database URL is derived from the postgresql values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trustgate.secretName" . }}-env
  labels: {{- include "trustgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "trustgate.databaseUrl" . | quote }}
  MOCK_SOC_DATABASE_URL: {{ include "trustgate.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.env }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
