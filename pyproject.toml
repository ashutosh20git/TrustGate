[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate-core"
version = "2.0.0"
description = "TrustGate: a deterministic action gate for AI SOC agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashutosh Neelesh Dubey" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlmodel>=0.0.16",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ingest = [
    "mail-parser>=3.15",
    "dkimpy>=1.1",
    "pyspf>=2.0.14",
    "dnspython>=2.6",
    "checkdmarc>=5.0",
    "tldextract>=5.1",
    "python-whois>=0.9",
    "tenacity>=8.2",
]
attachments = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23"]
# QR codes (OpenCV) and OCR (Tesseract; needs the tesseract binary) in image attachments.
images = ["opencv-python-headless>=4.8", "pytesseract>=0.3.10", "Pillow>=10"]
output-scan = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Prompt Guard 2 + LLM Guard. llm-guard needs Python 3.11/3.12 (see PLACEHOLDERS.md).
detector = ["transformers>=4.40", "torch>=2.2", "llm-guard>=0.3.15"]
recheck-xgb = ["xgboost>=2.0", "scikit-learn>=1.4"]
mcp = ["mcp>=2.3,<3"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1"]
agent = ["litellm>=1.40", "langgraph>=0.2", "langchain-core>=0.2"]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "pandas>=2.2"]
eval = ["pandas>=2.2", "numpy>=1.26"]
bench = ["agentdojo==0.1.35"]  # eval/agentdojo_bench.py
dev = ["pytest>=8", "fakeredis>=2.23", "opentelemetry-sdk>=1.24", "segno>=1.6"]

[tool.setuptools.packages.find]
include = ["trustgate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "opa: needs the OPA binary (.tools/opa.exe or opa on PATH)",
    "presidio: needs presidio-analyzer and a spaCy model",
]
